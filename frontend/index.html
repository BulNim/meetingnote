<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeetingNote - 회의록 자동 정리</title>
  <!-- 파일 2개 제약 - favicon 요청(404)을 막으려고 빈 아이콘을 둔다 -->
  <link rel="icon" href="data:,">
  <script>
    // 첫 화면이 깜빡이지 않게 Tailwind 보다 먼저 테마를 정한다. 저장값이 없으면 시스템 설정을 따른다
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) { saved = null; }
      var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', '"Apple SD Gothic Neo"', '"Segoe UI"', '"Malgun Gothic"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-b from-slate-100 to-slate-200 font-sans text-neutral-800 antialiased dark:from-neutral-950 dark:to-neutral-900 dark:text-neutral-100">

  <!-- 공통: 상단 고정 헤더 - 제목 + 탭 3개 + 테마 버튼 -->
  <header class="sticky top-0 z-30 border-b border-black/5 bg-white/70 backdrop-blur-xl dark:border-white/10 dark:bg-neutral-900/70">
    <div class="mx-auto flex max-w-6xl items-center gap-2 px-4 py-3 sm:gap-3">
      <div class="mr-auto flex min-w-0 items-baseline gap-3">
        <h1 class="truncate text-base font-semibold tracking-tight sm:text-lg">MeetingNote</h1>
        <span class="hidden text-xs text-neutral-500 sm:inline dark:text-neutral-400">회의록 자동 정리</span>
      </div>
      <nav class="flex shrink-0 items-center gap-0.5 sm:gap-1 rounded-xl bg-black/5 p-1 dark:bg-white/10" role="tablist" aria-label="화면">
        <button type="button" role="tab" data-tab="list" class="whitespace-nowrap rounded-lg px-2 py-1.5 text-sm font-medium transition sm:px-4">목록</button>
        <button type="button" role="tab" data-tab="new" class="whitespace-nowrap rounded-lg px-2 py-1.5 text-sm font-medium transition sm:px-4">넣기</button>
        <button type="button" role="tab" data-tab="todos" class="whitespace-nowrap rounded-lg px-2 py-1.5 text-sm font-medium transition sm:px-4">할 일</button>
      </nav>
      <button type="button" id="btnTheme" aria-label="테마 바꾸기" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-neutral-600 transition hover:bg-black/5 dark:text-neutral-300 dark:hover:bg-white/10">
        <svg viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">

    <!-- 화면 1: 목록 -->
    <section id="viewList" data-view="list" class="hidden">
      <div class="grid grid-cols-2 gap-2 sm:grid-cols-[minmax(0,1fr)_11rem_11rem] sm:gap-3">
        <input id="q" type="search" autocomplete="off" placeholder="제목 또는 참석자로 검색"
          class="col-span-2 w-full rounded-xl border border-black/10 bg-white/80 px-4 py-2.5 text-sm shadow-sm outline-none transition placeholder:text-neutral-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/20 sm:col-span-1 dark:border-white/10 dark:bg-white/5">
        <label class="flex min-w-0 items-center gap-2 rounded-xl border border-black/10 bg-white/80 px-3 shadow-sm transition focus-within:border-sky-500 focus-within:ring-4 focus-within:ring-sky-500/20 dark:border-white/10 dark:bg-white/5">
          <span class="text-xs text-neutral-500 dark:text-neutral-400">from</span>
          <input id="from" type="date" class="min-w-0 flex-1 bg-transparent py-2.5 text-sm outline-none dark:[color-scheme:dark]">
        </label>
        <label class="flex min-w-0 items-center gap-2 rounded-xl border border-black/10 bg-white/80 px-3 shadow-sm transition focus-within:border-sky-500 focus-within:ring-4 focus-within:ring-sky-500/20 dark:border-white/10 dark:bg-white/5">
          <span class="text-xs text-neutral-500 dark:text-neutral-400">to</span>
          <input id="to" type="date" class="min-w-0 flex-1 bg-transparent py-2.5 text-sm outline-none dark:[color-scheme:dark]">
        </label>
      </div>
      <p id="listStatus" data-base="mt-3 text-sm" class="mt-3 text-sm text-neutral-500" aria-live="polite"></p>
      <div id="cards" class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2 sm:gap-4"></div>
    </section>

    <!-- 화면 2: 넣기 -->
    <section id="viewNew" data-view="new" class="hidden">
      <div class="space-y-3 rounded-2xl bg-white/70 p-4 shadow-sm ring-1 ring-black/5 backdrop-blur-xl sm:p-6 dark:bg-white/5 dark:ring-white/10">
        <input id="title" type="text" maxlength="200" autocomplete="off" placeholder="제목"
          class="w-full rounded-xl border border-black/10 bg-white/80 px-4 py-2.5 text-sm shadow-sm outline-none transition placeholder:text-neutral-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/20 dark:border-white/10 dark:bg-white/5">
        <div class="grid gap-3 sm:grid-cols-2">
          <label class="flex min-w-0 items-center gap-3 rounded-xl border border-black/10 bg-white/80 px-4 shadow-sm transition focus-within:border-sky-500 focus-within:ring-4 focus-within:ring-sky-500/20 dark:border-white/10 dark:bg-white/5">
            <span class="shrink-0 text-sm text-neutral-500 dark:text-neutral-400">일시</span>
            <input id="metAt" type="datetime-local" class="min-w-0 flex-1 bg-transparent py-2.5 text-sm outline-none dark:[color-scheme:dark]">
          </label>
          <input id="attendees" type="text" autocomplete="off" placeholder="참석자 (쉼표로 구분)"
            class="w-full rounded-xl border border-black/10 bg-white/80 px-4 py-2.5 text-sm shadow-sm outline-none transition placeholder:text-neutral-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/20 dark:border-white/10 dark:bg-white/5">
        </div>
        <div class="grid gap-3 sm:grid-cols-2 sm:items-center">
          <input id="file" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav"
            class="w-full min-w-0 rounded-xl border border-black/10 bg-white/80 p-1.5 text-sm text-neutral-600 shadow-sm file:mr-3 file:rounded-lg file:border-0 file:bg-slate-200 file:px-3 file:py-1.5 file:text-sm file:font-medium file:text-neutral-700 hover:file:bg-slate-300 dark:border-white/10 dark:bg-white/5 dark:text-neutral-300 dark:file:bg-white/10 dark:file:text-neutral-100">
          <div class="flex min-w-0 flex-wrap items-center gap-3">
            <button type="button" id="btnUp" data-label="받아쓰기"
              class="rounded-xl bg-cyan-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-cyan-700 disabled:cursor-not-allowed disabled:opacity-50">받아쓰기</button>
            <p id="upStatus" data-base="min-w-0 flex-1 text-sm" class="min-w-0 flex-1 text-sm text-neutral-500" aria-live="polite">녹취 파일(mp3 · wav, 25MB 이하)을 고른 뒤 누르세요</p>
          </div>
        </div>
        <textarea id="body" rows="9" placeholder="본문 - 받아쓴 원문 또는 붙여넣은 메모"
          class="block w-full resize-y rounded-xl border border-black/10 bg-white/80 px-4 py-3 text-sm leading-relaxed shadow-sm outline-none transition placeholder:text-neutral-400 focus:border-sky-500 focus:ring-4 focus:ring-sky-500/20 dark:border-white/10 dark:bg-white/5"></textarea>
        <div class="flex flex-wrap items-center gap-3">
          <button type="button" id="btnSave" data-label="정리하기"
            class="rounded-xl bg-slate-800 px-7 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-900 disabled:cursor-not-allowed disabled:opacity-50 dark:bg-sky-600 dark:hover:bg-sky-500">정리하기</button>
          <p id="saveStatus" data-base="min-w-0 flex-1 text-sm" class="min-w-0 flex-1 text-sm text-neutral-500" aria-live="polite"></p>
        </div>
      </div>
      <!-- 결과 세 칸: 요약 · 결정사항 · 할 일 (app.js 가 채운다) -->
      <div id="result" class="mt-4 grid gap-3 sm:grid-cols-3"></div>
    </section>

    <!-- 화면 4: 할 일 -->
    <section id="viewTodos" data-view="todos" class="hidden">
      <div class="overflow-x-auto rounded-2xl bg-white/70 shadow-sm ring-1 ring-black/5 backdrop-blur-xl dark:bg-white/5 dark:ring-white/10">
        <table class="w-full min-w-[40rem] text-left text-sm">
          <thead class="bg-slate-800 text-white dark:bg-white/10">
            <tr>
              <th scope="col" class="px-4 py-3 font-semibold">내용</th>
              <th scope="col" class="w-28 px-4 py-3 font-semibold">담당자</th>
              <th scope="col" class="w-36 px-4 py-3 font-semibold">기한</th>
              <th scope="col" class="w-40 px-4 py-3 font-semibold">회의</th>
            </tr>
          </thead>
          <tbody id="todoBody" class="divide-y divide-black/5 dark:divide-white/10"></tbody>
        </table>
      </div>
      <p id="todoStatus" data-base="mt-3 text-sm" class="mt-3 text-sm text-neutral-500" aria-live="polite"></p>
    </section>
  </main>

  <!-- 화면 3: 상세 - 카드를 누르면 뜨는 겹침 창 -->
  <div id="modal" class="fixed inset-0 z-40 hidden items-center justify-center bg-black/40 p-3 backdrop-blur-sm sm:p-6" role="dialog" aria-modal="true" aria-labelledby="mHeading">
    <div class="max-h-[calc(100vh-1.5rem)] w-full max-w-4xl overflow-y-auto rounded-2xl bg-white/90 p-5 shadow-2xl ring-1 ring-black/5 backdrop-blur-xl sm:max-h-[calc(100vh-3rem)] sm:p-7 dark:bg-neutral-900/90 dark:ring-white/10">
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h2 id="mHeading" class="break-words text-xl font-semibold tracking-tight"></h2>
          <p id="mMeta" class="mt-1 break-words text-sm text-neutral-500 dark:text-neutral-400"></p>
        </div>
        <button type="button" id="btnClose" class="shrink-0 rounded-lg px-3 py-1.5 text-sm text-neutral-600 transition hover:bg-black/5 dark:text-neutral-300 dark:hover:bg-white/10">닫기</button>
      </div>
      <div id="mResult" class="mt-5 grid gap-3 sm:grid-cols-3"></div>
      <details class="mt-4 rounded-xl px-1">
        <summary class="cursor-pointer select-none py-1 text-sm text-neutral-600 dark:text-neutral-300">받아쓴 본문 보기</summary>
        <pre id="mBody" class="mt-2 max-h-72 overflow-y-auto whitespace-pre-wrap break-words rounded-xl bg-black/5 p-4 font-sans text-sm leading-relaxed dark:bg-white/5"></pre>
      </details>
      <div class="mt-5 flex flex-col gap-2 sm:flex-row sm:items-center">
        <input id="mTitle" type="text" maxlength="200" autocomplete="off" placeholder="제목 수정칸" aria-label="제목 수정칸"
          class="w-full min-w-0 flex-1 rounded-xl border border-black/10 bg-white/80 px-4 py-2.5 text-sm shadow-sm outline-none transition focus:border-sky-500 focus:ring-4 focus:ring-sky-500/20 dark:border-white/10 dark:bg-white/5">
        <div class="flex gap-2">
          <button type="button" id="btnRename" data-label="제목 수정"
            class="flex-1 rounded-xl bg-slate-800 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-900 disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none dark:bg-sky-600 dark:hover:bg-sky-500">제목 수정</button>
          <button type="button" id="btnDelete" data-label="삭제"
            class="flex-1 rounded-xl bg-rose-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-rose-700 disabled:cursor-not-allowed disabled:opacity-50 sm:flex-none">삭제</button>
        </div>
      </div>
      <p id="mStatus" data-base="mt-3 text-xs" class="mt-3 text-xs text-neutral-500" aria-live="polite"></p>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
